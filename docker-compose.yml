services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_db
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user", "-d", "user_db"]
      interval: 2s
      retries: 15
    restart: unless-stopped

  zookeeper:
    image: bitnami/zookeeper:3.8
    environment: [ALLOW_ANONYMOUS_LOGIN=yes]
    ports: ["2181:2181"]
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    depends_on: [zookeeper]
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    ports: ["9092:9092"]
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka]
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    ports: ["8080:8080"]
    restart: unless-stopped

  user_service:
    build:
      context: .               
      dockerfile: user_service/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: user_db
      SECRET_KEY: MY_SUPER_SECRET_KEY
      KAFKA_BOOTSTRAP: kafka:9092
      PYTHONUNBUFFERED: 1
    depends_on: [db]
    ports: ["8001:8001"]
    restart: unless-stopped

  post_service:
    build:
      context: .
      dockerfile: post_service/Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      PYTHONUNBUFFERED: 1
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:50051", "list"]
      interval: 5s
      retries: 12
    ports: ["50051:50051"]
    restart: unless-stopped

  api_post_service:
    build:
      context: .
      dockerfile: api_post_service/Dockerfile
    environment:
      SECRET_KEY: MY_SUPER_SECRET_KEY
      GRPC_POST_SERVICE: post_service:50051
      PYTHONUNBUFFERED: 1
    depends_on: [post_service]
    ports: ["8002:8002"]
    restart: unless-stopped

  api_service:
    build:
      context: .
      dockerfile: api_service/Dockerfile
    environment:
      USER_SERVICE_URL:  http://user_service:8001
      POST_API_URL:      http://api_post_service:8002
      PYTHONUNBUFFERED: 1
    depends_on: [user_service, api_post_service]
    ports: ["8000:8000"]
    restart: unless-stopped